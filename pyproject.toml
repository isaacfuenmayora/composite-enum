[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composite-enum"
version = "0.1.0"
description = "Build superset enums by composing members from other enums"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["enum", "composition", "metaclass"]
authors = [
    { name = "Isaac Fuenmayor", email = "contact@hireisaac.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[dependency-groups]
test = ["pytest >= 8.0"]

[project.urls]
Homepage = "https://github.com/isaacfuenmayora/composite-enum"
Repository = "https://github.com/isaacfuenmayora/composite-enum"
Issues = "https://github.com/isaacfuenmayora/composite-enum/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
